[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "venv",
    "data",
    "ds003969",
    "calibration_logs",
    "validation_logs",
    "database/migrations",
    "analytics/migrations",
]

[tool.ruff.lint]
# C901 = complejidad ciclomática (gate #6). E/F/W = pycodestyle+pyflakes base.
select = ["E", "F", "W", "C901"]
mccabe = { max-complexity = 10 }

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
mypy_path = "."
exclude = [
    "venv",
    "data",
    "ds003969",
    "scripts",
    "database/migrations",
    "analytics/migrations",
]
# Terceros sin stubs — no bloquean el gate por falta de tipado ajeno.
[[tool.mypy.overrides]]
module = [
    "muselsl.*", "pylsl.*", "bleak.*", "mne.*", "torch.*",
    "influxdb_client.*", "psycopg2.*", "asyncpg.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["."]
asyncio_mode = "auto"
norecursedirs = ["venv", "data", "ds003969", "calibration_logs", "validation_logs", "scripts"]

[tool.coverage.run]
source = ["."]
omit = [
    "venv/*", "data/*", "ds003969/*", "calibration_logs/*", "validation_logs/*",
    "scripts/*", "test_*.py", "*/migrations/*", "MAIN_INTEGRATION_EXAMPLE.py",
]

[tool.importlinter]
root_packages = ["replay", "futbol", "accounts", "fiscal"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "replay core never imports infrastructure (GCS / bootstrap)"
type = "forbidden"
source_modules = [
    "replay.brain", "replay.format", "replay.docs", "replay.reader", "replay.synthetic", "replay.exporter",
]
forbidden_modules = ["replay.gcs", "replay.bootstrap"]

[[tool.importlinter.contracts]]
name = "futbol layers: domain <- application <- infrastructure"
type = "layers"
layers = ["futbol.infrastructure", "futbol.application", "futbol.domain"]
ignore_imports = []

[[tool.importlinter.contracts]]
name = "accounts layers: application <- infrastructure"
type = "layers"
layers = ["accounts.infrastructure", "accounts.application"]

[[tool.importlinter.contracts]]
name = "fiscal layers: domain <- application <- infrastructure"
type = "layers"
layers = ["fiscal.infrastructure", "fiscal.application", "fiscal.domain"]

[[tool.importlinter.contracts]]
name = "fiscal domain is pure: no accounts, no futbol, no I/O libraries"
type = "forbidden"
source_modules = ["fiscal.domain", "fiscal.application"]
forbidden_modules = ["accounts", "futbol", "asyncpg", "fastapi", "anthropic"]

[[tool.importlinter.contracts]]
name = "shared accounts never depend on the apps that use them"
type = "forbidden"
source_modules = ["accounts"]
forbidden_modules = ["futbol", "fiscal"]
